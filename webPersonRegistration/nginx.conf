events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Configuração de log
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Configurações de performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Resolver DNS do Docker
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        text/javascript;

    # Configuração do servidor
    server {
        listen 3031;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        
        # ========================================
        # Headers de Segurança Completos
        # ========================================
        
        # Previne clickjacking (DENY bloqueia todos os iframes)
        add_header X-Frame-Options "DENY" always;
        
        # Proteção XSS para browsers antigos
        add_header X-XSS-Protection "1; mode=block" always;
        
        # Previne MIME sniffing
        add_header X-Content-Type-Options "nosniff" always;
        
        # Controla informações do Referrer
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        
        # Bloqueia APIs sensíveis do navegador
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;
        
        # Content Security Policy (CSP) - Proteção contra XSS
        # Configuração para desenvolvimento (permite inline necessário para React/Vite)
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' http://api_person_registration:8080; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
        
        # HSTS - Force HTTPS (APENAS EM PRODUÇÃO COM HTTPS CONFIGURADO!)
        # Descomente a linha abaixo quando tiver certificado SSL
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;


        # Frontend - Servir React
        location / {
            try_files $uri $uri/ /index.html;
            
            # Cache para assets
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
            }
        }

        # Proxy para Backend API
        location /api/ {
            # Remover /api do path antes de enviar para o backend
            # rewrite ^/api/(.*)$ /$1 break;
            
            # set $backend "api_person_registration:8080";
            # proxy_pass http://$backend;
            proxy_pass http://api_person_registration:8080/api/;
            
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
<<<<<<< Updated upstream
