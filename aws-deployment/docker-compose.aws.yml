networks:
  projeto-person-registration:
    driver: bridge

services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres_api_person_registration
    restart: always
    environment:
      POSTGRES_DB: bd_apipersonregistration
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-root}
      POSTGRES_INITDB_ARGS: "-E UTF8"
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - projeto-person-registration
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d bd_apipersonregistration"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    command: >
      postgres
      -c shared_buffers=128MB
      -c max_connections=100
      -c work_mem=4MB

  mongodb:
    image: mongo:7-jammy
    container_name: mongodb-container
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - projeto-person-registration
    command: >
      mongod
      --quiet
      --logpath /dev/null
      --wiredTigerCacheSizeGB 0.25
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  redis:
    image: redis:7-alpine
    container_name: redis_cache
    restart: always
    ports:
      - "6379:6379"
    networks:
      - projeto-person-registration
    command: >
      redis-server
      --maxmemory 100mb
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M

  rabbitmq:
    image: rabbitmq:3.12-alpine
    container_name: rabbitmq-container
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
      RABBITMQ_VM_MEMORY_HIGH_WATERMARK: 0.5
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-rabbit log_levels [{connection,error}]"
    networks:
      - projeto-person-registration
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  mailhog:
    image: mailhog/mailhog
    container_name: mailhog_container
    restart: always
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - projeto-person-registration
    deploy:
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 32M

  api_person_registration:
    image: jorgemeyrelles/api-person-registration:latest
    container_name: api_person_registration
    restart: always
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/bd_apipersonregistration
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-root}
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/person_logs
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-guest}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASS:-guest}
      SPRING_MAIL_HOST: mailhog
      SPRING_MAIL_PORT: 1025
      JAVA_OPTS: >-
        -Xmx512m
        -Xms256m
        -XX:+UseG1GC
        -XX:MaxGCPauseMillis=200
        -XX:+UseStringDeduplication
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
      mongodb:
        condition: service_started
    networks:
      - projeto-person-registration
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 768M
        reservations:
          memory: 512M

  web-person-registration:
    image: jorgemeyrelles/web-person-registration:latest
    container_name: web_person_registration
    restart: always
    ports:
      - "3031:3031"
    environment:
      - NODE_ENV=production
      - PORT=3031
      - VITE_API_BASE_URL=http://${PUBLIC_IP:-localhost}:8081
    depends_on:
      - api_person_registration
    networks:
      - projeto-person-registration
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3031"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

volumes:
  postgres_data:
    driver: local
  mongodb_data:
    driver: local
